[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-trading-chat"
version = "0.1.0"
description = "Agent-orchestrated, evidence-grounded equity research debates"
requires-python = ">=3.11"
dependencies = ["feedparser>=6", "python-dotenv>=1.0", "yfinance>=0.2.54", "Jinja2>=3.1"]

[dependency-groups]
dev = ["ruff", "pytest", "pre-commit"]

[project.scripts]
trading-debate = "trading_debate.cli:main"

[tool.setuptools.packages.find]
include = ["trading_debate*"]
exclude = ["data*", "reports*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require internet connectivity to live services",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["dump_evidence.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM117", "PT006"]
